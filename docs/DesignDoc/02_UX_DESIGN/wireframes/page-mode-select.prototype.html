<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模式选择 — 向导Agent平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f14; color: #e8e8ed;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; user-select: none;
  }
  .container { text-align: center; max-width: 800px; padding: 40px; }
  h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #fff; }
  .subtitle { font-size: 15px; color: #8888a0; margin-bottom: 48px; }

  .cards { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .card {
    width: 340px; padding: 36px 28px 28px;
    border-radius: 16px; cursor: pointer;
    transition: transform .2s, box-shadow .2s, border-color .2s;
    text-align: left; position: relative;
    border: 2px solid #2a2a3a;
    background: #181820;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .card.quick:hover { border-color: #7c5cfc; }
  .card.long:hover  { border-color: #38bdf8; }

  .card-icon { font-size: 36px; margin-bottom: 16px; }
  .card h3 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #fff; }
  .card .desc { font-size: 13px; color: #8888a0; line-height: 1.6; margin-bottom: 16px; }
  .card .examples { font-size: 12px; color: #666680; }
  .card .examples span { display: inline-block; background: #1e1e2a; padding: 3px 10px; border-radius: 12px; margin: 3px 4px 3px 0; }
  .card .hint { font-size: 11px; color: #555570; margin-top: 14px; }

  .badge { position: absolute; top: 16px; right: 16px; font-size: 11px; padding: 2px 10px; border-radius: 10px; }
  .card.quick .badge { background: #7c5cfc22; color: #a78bfa; }
  .card.long  .badge { background: #38bdf822; color: #7dd3fc; }

  .click-ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.15); transform: scale(0); animation: ripple .5s ease-out forwards; pointer-events: none; }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>
<div class="container">
  <h1>你想做什么？</h1>
  <p class="subtitle">不用担心，你不需要懂技术——告诉我你的想法就行</p>

  <div class="cards">
    <div class="card quick" onclick="selectMode('quick')" id="card-quick">
      <span class="badge">推荐</span>
      <div class="card-icon">⚡</div>
      <h3>快速做一个工具</h3>
      <p class="desc">适合试试想法、做个小工具、验证一个点子。<br>我们简单聊聊就开干，边做边改。</p>
      <div class="examples">
        <span>读书笔记</span> <span>订餐统计</span> <span>个人记账</span> <span>活动报名</span>
      </div>
      <p class="hint">几分钟就能看到预览效果</p>
    </div>

    <div class="card long" onclick="selectMode('long')" id="card-long">
      <span class="badge">适合持续打磨</span>
      <div class="card-icon">🏗️</div>
      <h3>做一个长期维护的项目</h3>
      <p class="desc">适合想持续更新、不断完善的项目。<br>我们会把基础打扎实，一步一步来。</p>
      <div class="examples">
        <span>开源工具</span> <span>社区网站</span> <span>团队协作</span> <span>个人品牌站</span>
      </div>
      <p class="hint">从方案设计开始，稳步推进</p>
    </div>
  </div>
</div>

<script>
  function selectMode(mode) {
    const card = document.getElementById(mode === 'quick' ? 'card-quick' : 'card-long');
    card.style.transform = 'scale(.96)';
    setTimeout(() => { card.style.transform = ''; }, 150);

    const label = mode === 'quick' ? '快速做一个工具' : '做一个长期维护的项目';
    // 原型模拟：点击后跳转到对应工作区
    if (mode === 'quick') {
      window.location.href = 'workspace-quick.prototype.html';
    } else {
      alert(`[原型模拟]\n选择了：${label}\n→ 将进入长期迭代型工作区\n\n（该原型页面待产出）`);
    }
  }
</script>
</body>
</html>
